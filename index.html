<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Perso</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">

    <!-- ONGLET 1 : TÂCHES -->
    <div id="tab-tasks" class="tab-content active">
      <div class="header">
        <h1>Mes Tâches</h1>
        <p>Organisez votre journée</p>
      </div>

      <div class="input-container">
        <input type="text" id="taskInput" placeholder="+ Ajouter une tâche...">
        <button class="btn-add" onclick="addTask()">+</button>
      </div>

      <ul id="taskList"></ul>
    </div>

    <!-- ONGLET 2 : POMODORO -->
    <div id="tab-pomodoro" class="tab-content">
      <div class="header">
        <h1>Session Focus</h1>
        <p>Reste concentré jusqu'à la fin</p>
      </div>

      <div class="pomodoro-container">
        <!-- Réglage manuel du temps -->
        <div class="timer-settings">
          <label for="minutesInput" class="settings-label">Durée (min) :</label>
          <input type="number" id="minutesInput" value="25" min="1" max="180" onchange="setCustomTime(this.value)">
        </div>

        <!-- Le Grand Cercle Bleu -->
        <div class="timer-circle">
          <div class="timer-time" id="timerDisplay">25:00</div>
          <div class="timer-label">TRAVAIL</div>
        </div>

        <!-- Bouton Démarrer -->
        <button class="btn-start" id="startBtn" onclick="toggleTimer()">Démarrer</button>
      </div>
    </div>

  </div>

  <!-- BARRE DE NAVIGATION EN BAS -->
  <div class="bottom-nav">
    <button class="nav-btn active" id="nav-tasks" onclick="switchTab('tasks')">
      📝 Tâches
    </button>
    <button class="nav-btn" id="nav-pomodoro" onclick="switchTab('pomodoro')">
      ⏱️ Pomodoro
    </button>
  </div>
  
<!-- Bibliothèque Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Notre script JavaScript -->
  <script src="script.js"></script>
</body>
</html>
